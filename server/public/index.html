<!DOCTYPE html>
<html>
    <head>
        <title>Unteruroven</title>
        <style>
            body{
                overflow: hidden;
            }
            button{
                cursor: pointer;
            }
            canvas {
                border: 1px solid black;
                background: #f0f0f0;
                width: 800px;
                height: 600px;
            }
            #roomInfo {
                font-family: monospace;
                visibility: hidden;
                display: flex;
            }
            #rmCode {
                margin-left: 10px;
                border: none;
                width: 70px;
                font-weight: 800;
            }
            input{
                padding: 0 !important;
            }
            #rmCode:focus{
                outline: none;
                border: none;
            }
            #gameDisplay {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 90vh;
                width: 100vw;
            }
            #controls {
                margin-top: 20px;
            }
            #leaveGame {
                visibility: hidden;
            }
            #cpyIcon{
                width: 25px;
                height: 25px;
                padding: 2.5px;
                margin-top: 10px;
                margin-left: 10px;
            }
            #username{
                display: flex;
                height: fit-content;
            }
            #usernameField{
                margin-left: 10px;
                margin-bottom: 10px;
                margin-top: 10px;
            }
            .playing{
                border: none;
            }
            .playing:focus{
                outline: none;
            }
        </style>
    </head>
    <body>
        <div id="gameDisplay">
            <div id="roomInfo">
                <p>Room Code:</p>
                <input id="rmCode" type="text" value="" readonly/>
                <button id="cpyIcon" onclick="copyRmCode()"><img src="https://unpkg.com/ionicons@7.1.0/dist/svg/copy-outline.svg" width="15px" height="15px"/></button>
            </div>
            <div id="username">
                <p>Username:</p>
                <input id="usernameField" type="text" value=""/>
            </div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="controls">
                <button onclick="createGame()">Create New Game</button>
                <input type="text" id="joinCode" maxlength="6" placeholder="Enter Room Code">
                <button onclick="joinGame()">Join Game</button>
            </div>
            <button id="leaveGame" onclick="leaveGame()">Leave Game</button>
        </div>

        <script>
            var animReq = null;
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let ws = null;
            let playerId = null;
            let username = "";
            let roomId = null;
            let positions = {};
            let usernames = {};
            
            // Player movement
            const keys = {};
            const playerSize = 30;
            let mVector = { x: 0, y: 0 };
            
            // Colors
            const colors = {
                player1: '#FF6B6B',
                player2: '#4ECDC4'
            };

            const updateRoomInfoDisplay = (display) => {
                document.getElementById('rmCode').value = roomId;
                document.getElementById('roomInfo').style.visibility = display ? "visible" : "hidden";
                document.getElementById('controls').style.visibility = display ? "hidden" : "visible";
                document.getElementById('leaveGame').style.visibility = display ? "visible" : "hidden";
                let userField = document.getElementById('usernameField');
                userField.readOnly = display;
                if(display){
                    userField.classList.add('playing');
                }else{
                    userField.classList.remove('playing');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            async function createGame() {
                const response = await fetch('./create-game', {
                    method: 'POST'
                });
                const data = await response.json();
                roomId = data.roomId;
                playerId = 'player_' + Math.random().toString(36).substr(2, 9);
                updateRoomInfoDisplay(true);
                connectWebSocket();
            }
            
            async function joinGame() {
                const joinCode = document.getElementById('joinCode').value.toUpperCase();
                if (joinCode) {
                    roomId = joinCode;
                    playerId = 'player_' + Math.random().toString(36).substr(2, 9);
                    connectWebSocket();
                }
            }

            function leaveGame() {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.close(1000, "Normal closure");
                }
                positions = {};
                usernames = {};
                mVector = {x: 0, y: 0};
                clearInterval(sendPosition);
                cancelAnimationFrame(animReq);
                updateRoomInfoDisplay(false);
            }
            
            function connectWebSocket() {
                ws = new WebSocket(`ws://${window.location.host}/ws?roomId=${roomId}&playerId=${playerId}&user=${username}`);
                
                ws.onopen = () => {
                    console.log('Connected to server');
                    // Start game loop
                    gameLoop();
                    // Send position updates every frame
                    setInterval(sendPosition, 50);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    switch(data.type) {
                        case 'game_state':
                            positions = data.positions;
                            usernames = data.users;
                            updateRoomInfoDisplay(true);
                            break;
                        case 'position_update':
                            positions[data.playerId] = data.position;
                            break;
                        case 'opponent_joined':
                            console.log('Opponent joined!');
                            usernames[data.playerId] = data.user;
                            break;
                        case 'player_disconnected':
                            console.log('Opponent disconnected');
                            delete positions[data.playerId];
                            delete usernames[data.playerId];
                            break;
                        case 'game_not_found':
                            console.log('game doesn\'t exist');
                            break;
                    }
                };
                
                ws.onerror = (error) => {
                    updateRoomInfoDisplay(false);
                    console.error('WebSocket error:', error);
                };
            }
            
            function sendPosition() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'position_update',
                        vector: mVector
                    }));
                }
                mVector = {x: 0, y: 0};
            }
            
            window.addEventListener("load", () => {
                // Handle keyboard input
                document.addEventListener('keydown', (e) => {
                    keys[e.key] = true;
                });
                
                document.addEventListener('keyup', (e) => {
                    keys[e.key] = false;
                });

                let userField = document.getElementById('usernameField');
                userField.value = username;
                userField.addEventListener('change', (e) => {
                    username = e.target.value;
                })
            })
            
            function updateMovement() {
                if (keys['ArrowUp'] || keys['w']) mVector.y -= 1;
                if (keys['ArrowDown'] || keys['s']) mVector.y += 1;
                if (keys['ArrowLeft'] || keys['a']) mVector.x -= 1;
                if (keys['ArrowRight'] || keys['d']) mVector.x += 1;
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw all players
                for (let id in positions) {
                    const pos = positions[id];
                    const isMe = (id === playerId);
                    const color = isMe ? '#FFD93D' : (id.includes('player_1') ? colors.player1 : colors.player2);
                    
                    ctx.fillStyle = color;
                    ctx.fillRect(pos.x, pos.y, playerSize, playerSize);
                    
                    // Add label
                    ctx.fillStyle = 'black';
                    ctx.font = '12px Arial';
                    let posY = pos.y < 15 ? pos.y + 45 : pos.y - 5;
                    ctx.fillText(isMe ? 'You' : (usernames[id] ?? 'player'), pos.x + 5, posY);
                }
            }
            
            function gameLoop() {
                updateMovement();
                draw();
                animReq = requestAnimationFrame(gameLoop);
            }

            function copyRmCode() {
                let code = document.getElementById('rmCode')
                code.select();
                document.execCommand("copy");
                code.blur();
            }

        </script>
    </body>
</html>
